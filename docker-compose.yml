services:
  flutter-android:
    build:
      context: .
      args:
        FLUTTER_VERSION: stable
        ANDROID_PLATFORM: android-37
        ANDROID_BUILD_TOOLS: 37.0.0
    image: sns-novahack/flutter-android:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle
      - firebase-config:/root/.config
      - android-sdk:/opt/android-sdk
      - android-debug-keystore:/root/.android
    environment:
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
    network_mode: host
    tty: true
    stdin_open: true

volumes:
  flutter-pub-cache:
  gradle-cache:
  firebase-config:
  android-sdk:
  android-debug-keystore:
